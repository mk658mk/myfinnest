<script>

  // { file: 'retirement-planning-india.html',     emoji: '🌴', title: 'Retirement Planning: How Much Do You Really Need?',        cat: 'Retirement',     min: 9,  desc: 'Step-by-step corpus calculation and asset allocation for a comfortable Indian retirement.' },
  // { file: 'child-education-planning.html',      emoji: '🌳', title: "Planning Your Child's Education Fund",                     cat: 'Family Finance', min: 8,  desc: 'Education inflation is 9% p.a. — here is how to stay ahead of it from day one.' },
  // { file: 'nps-complete-guide.html',            emoji: '🏛️', title: 'NPS Complete Guide: Should You Invest?',                   cat: 'Retirement',     min: 8,  desc: 'All NPS tax benefits, returns, withdrawal rules and comparison with EPF and PPF.' },

  // { file: 'index-funds-india.html',             emoji: '📉', title: 'Index Funds in India: The Low-Cost Path to Returns',       cat: 'Investing',      min: 7,  desc: 'Why Warren Buffett recommends index funds — and how to build a simple 3-fund portfolio.' },
  // { file: 'term-insurance-guide.html',          emoji: '🔒', title: 'Term Insurance in India: Why You Need It',                 cat: 'Insurance',      min: 7,  desc: 'How much cover you need, why pure term beats endowment, and how to choose the right policy.' },
  // { file: 'ppf-complete-guide.html',            emoji: '🏦', title: 'PPF: Your Complete Guide to Public Provident Fund',        cat: 'Tax Saving',     min: 7,  desc: 'EEE tax status, deposit rules, partial withdrawals, and how to maximise PPF returns.' },

  // { file: 'gold-investment-india.html',         emoji: '🥇', title: 'Investing in Gold: Physical, SGB, ETF Compared',           cat: 'Investing',      min: 7,  desc: 'Why Sovereign Gold Bonds beat every other form of gold investment in India.' },
  // { file: 'tax-saving-investments-india.html',  emoji: '📋', title: 'Best Tax-Saving Investments Under Section 80C (2024–25)',  cat: 'Tax Saving',     min: 7,  desc: 'Compare all 80C options and build the optimal tax-saving strategy for your income level.' },
];

// ── UI BOOTSTRAP ──────────────────────────────────────────────────────────────
const gridEl    = document.getElementById('articleGrid');
const filterBar = document.getElementById('filterBar');
const searchEl  = document.getElementById('searchInput');
const resultsBar = document.getElementById('resultsBar');

document.getElementById('totalCount').textContent = ARTICLES.length;

// Build category filter buttons
const cats = ['All', ...new Set(ARTICLES.map(a => a.cat))].sort((a, b) => a === 'All' ? -1 : b === 'All' ? 1 : a.localeCompare(b));
cats.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn' + (cat === 'All' ? ' active' : '');
  btn.dataset.cat = cat.toLowerCase();
  btn.textContent = cat;
  filterBar.appendChild(btn);
});
const categoriesCount = new Set(ARTICLES.map(a => a.cat)).size;
document.getElementById('categoryCount').textContent = categoriesCount;

// Render article cards
function renderCards(list) {
  gridEl.innerHTML = '';
  if (!list.length) {
    gridEl.innerHTML = '<div class="no-results"><div class="big">🔍</div><strong>No articles found</strong><br/>Try a different search or category.</div>';
    resultsBar.textContent = 'No articles match your search.';
    return;
  }
  list.forEach((a, i) => {
    const card = document.createElement('a');
    card.className = 'article-card';
    card.href = 'blog/'+a.file;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    card.dataset.cat = a.cat.toLowerCase();
    card.innerHTML = `
      <div class="card-head">
        <div class="card-emoji">${a.emoji}</div>
        <div class="card-meta">
          <span class="cat-tag">${a.cat}</span>
          <span class="read-time">⏱ ${a.min} min</span>
        </div>
      </div>
      <h2>${a.title}</h2>
      <p>${a.desc}</p>
      <div class="card-footer">
        <span class="read-link">Read article <span class="arrow">→</span></span>
        <span class="card-num">#${String(i + 1).padStart(2, '0')}</span>
      </div>`;
    gridEl.appendChild(card);
  });
  resultsBar.textContent = `Showing ${list.length} of ${ARTICLES.length} article${ARTICLES.length !== 1 ? 's' : ''}`;
}
renderCards(ARTICLES);

// ── FILTER + SEARCH ───────────────────────────────────────────────────────────
let activeCat = 'all';
let searchVal = '';

function applyFilter() {
  const filtered = ARTICLES.filter(a => {
    const matchCat    = activeCat === 'all' || a.cat.toLowerCase() === activeCat;
    const matchSearch = (a.title + ' ' + a.cat + ' ' + a.desc).toLowerCase().includes(searchVal);
    return matchCat && matchSearch;
  });
  renderCards(filtered);
}

filterBar.addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCat = btn.dataset.cat;
  applyFilter();
});

searchEl.addEventListener('input', () => {
  searchVal = searchEl.value.toLowerCase().trim();
  applyFilter();
});

// ── THEME — matches home.html's toggleTheme() exactly ─────────────────────────
function toggleTheme() {
  const isNowLight = document.documentElement.classList.toggle('light');
  localStorage.setItem('mfn-theme', isNowLight ? 'light' : 'dark');
}
// Restore saved preference or system preference on load
(function initTheme() {
  const saved = localStorage.getItem('mfn-theme');
  const preferLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  if (saved === 'light' || (!saved && preferLight)) {
    document.documentElement.classList.add('light');
  }
})();

// ── MOBILE MENU — uses home.css classes (.sm.on / .ov.on) ─────────────────────
function openMenu() {
  document.getElementById('sm').classList.add('on');
  document.getElementById('ov').classList.add('on');
}
function closeMenu() {
  document.getElementById('sm').classList.remove('on');
  document.getElementById('ov').classList.remove('on');
}

// ── go() — navbar menu links navigate to the main site ────────────────────────
(function () {
  var FILE_MAP = {
    'home':   'home.html',
    'si':     'calculators/simple-interest.html',
    'ci':     'calculators/compound-interest.html',
    'emi':    'calculators/emi.html',
    'prepay': 'calculators/loan-prepayment.html',
    'bp':     'calculators/blueprint.html',
    'retire': 'calculators/retirement.html',
    'fire':   'calculators/fire.html',
    'infl':   'calculators/inflation.html',
    'crore':  'calculators/first-crore.html',
    'swp':    'calculators/swp.html',
    'nps':    'calculators/nps.html'
  };
  window.go = function (page) {
    var f = FILE_MAP[page]; if (f) window.location.href = f;
  };
})();

// ── COMPONENT LOADER — mirrors home.html exactly ───────────────────────────────
(function () {
  var components = [
    { url: 'components/navbar.html', id: 'navbar-container' },
    { url: 'components/footer.html', id: 'footer-container' }
  ];

  var loaded = 0;

  function tryReinit() {
    loaded++;
    if (loaded === components.length) {
      // Mark the Blog menu item as active after navbar is injected
      try {
        document.querySelectorAll('.mi').forEach(function (el) {
          if (el.textContent.trim().indexOf('Blog') !== -1) el.classList.add('act');
        });
      } catch (e) {}
    }
  }

  components.forEach(function (c) {
    fetch(c.url)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (html) {
        var el = document.getElementById(c.id);
        if (el) el.innerHTML = html;   // innerHTML, not outerHTML
        tryReinit();
      })
      .catch(function () {
        tryReinit(); // still count on failure so tryReinit always completes
      });
  });
})();
</script>
