<!-- ── MAIN PAGE ── -->
<div class="pg on">

  <!-- HERO -->
  <div class="blog-hero">
    <div class="hero-label">📝 Personal Finance Blog</div>
    <h1>Learn. Plan. <span>Grow.</span></h1>

    <div class="hero-stats">

          <div class="stat-val" id="totalCount">—</div>

  <!-- CONTROLS -->

  <!-- ARTICLE GRID -->
  <div class="article-grid" id="articleGrid">
    <div class="article-card skeleton" aria-hidden="true" style="min-height:200px;opacity:.4;pointer-events:none"></div>
    <div class="article-card skeleton" aria-hidden="true" style="min-height:200px;opacity:.4;pointer-events:none"></div>

  </div>

</div><!-- /.pg -->

<!-- ═══ FOOTER COMPONENT ═══ -->
<div id="footer-container"></div>



<script>
// ─────────────────────────────────────────────────────────────────────────────
// AUTO-SCAN: reads blog/ directory listing, fetches each article's meta,
// then opens articles inline via a reader overlay (no page navigation).
// ─────────────────────────────────────────────────────────────────────────────

const BLOG_DIR = 'blog/';

const gridEl       = document.getElementById('articleGrid');
const filterBar    = document.getElementById('filterBar');
const searchEl     = document.getElementById('searchInput');
const resultsBar   = document.getElementById('resultsBar');


// ── META HELPERS ──────────────────────────────────────────────────────────────
function getMeta(html, name) {
  const re = new RegExp(
    '<meta[^>]+name=["\']' + name + '["\'][^>]+content=["\']([^"\']*)["\']' +
    '|<meta[^>]+content=["\']([^"\']*)["\'][^>]+name=["\']' + name + '["\']',
    'i'
  );
  const m = html.match(re);
  return m ? (m[1] || m[2] || '').trim() : '';
}

function getTitle(html) {
  const m = html.match(/<title[^>]*>(.*?)<\/title>/is);
  return m ? m[1].replace(/<[^>]+>/g, '').trim() : '';
}

// ── FETCH ARTICLE META (for card data) ───────────────────────────────────────
async function fetchArticleMeta(filename) {
  try {
    const res  = await fetch(BLOG_DIR + filename);
    if (!res.ok) return null;
    const html = await res.text();
    return {
      file  : BLOG_DIR + filename,          // e.g. blog/what-is-sip.html
      emoji : getMeta(html, 'emoji')        || '📄',
      title : getTitle(html)                || getMeta(html, 'og:title') || filename,
      cat   : getMeta(html, 'category')     || 'General',
      min   : parseInt(getMeta(html, 'readtime'), 10) || 7,
      desc  : getMeta(html, 'description')  || '',
    };
  } catch {
    return null;
  }
}



// ── SCAN blog/ FOLDER ─────────────────────────────────────────────────────────
async function scanBlogFolder() {
  let files = [];
  try {
    const res  = await fetch(BLOG_DIR);
    const html = await res.text();
    const re   = /href="([^"\/]+\.html)"/gi;
    let m;
    while ((m = re.exec(html)) !== null) files.push(m[1]);
  } catch {
    resultsBar.textContent = '⚠️ Could not read blog/ folder. Make sure directory listing is enabled on your server.';
    gridEl.innerHTML = '';
    return;
  }

  if (!files.length) {
    gridEl.innerHTML = '<div class="no-results"><div class="big">📂</div><strong>No articles yet</strong><br/>Upload HTML files to the <code>blog/</code> folder.</div>';
    resultsBar.textContent = 'No articles found.';
    document.getElementById('totalCount').textContent    = 0;
    document.getElementById('categoryCount').textContent = 0;
    return;
  }

  const results  = await Promise.all(files.map(fetchArticleMeta));
  const ARTICLES = results.filter(Boolean);
  ARTICLES.sort((a, b) => a.file.localeCompare(b.file));

  document.getElementById('totalCount').textContent = ARTICLES.length;
  const uniqueCats = [...new Set(ARTICLES.map(a => a.cat))];
  document.getElementById('categoryCount').textContent = uniqueCats.length;

  // Filter buttons
  filterBar.innerHTML = '';
  ['All', ...uniqueCats.sort((a, b) => a.localeCompare(b))].forEach(cat => {
    const btn = document.createElement('button');
    btn.className   = 'filter-btn' + (cat === 'All' ? ' active' : '');
    btn.dataset.cat = cat.toLowerCase();
    btn.textContent = cat;
    filterBar.appendChild(btn);
  });

  // ── Render cards (div, not <a> — click opens reader overlay) ──────────────
  function renderCards(list) {
    gridEl.innerHTML = '';
    if (!list.length) {
      gridEl.innerHTML = '<div class="no-results"><div class="big">🔍</div><strong>No articles found</strong><br/>Try a different search or category.</div>';
      resultsBar.textContent = 'No articles match your search.';
      return;
    }
    list.forEach((a, i) => {
      const card = document.createElement('a');
      card.className   = 'article-card';
      card.href        = a.file;   // blog/file_name.html
      card.target      = '_blank';
      card.rel         = 'noopener noreferrer';
      card.dataset.cat = a.cat.toLowerCase();
      card.innerHTML = `
        <div class="card-head">
          <div class="card-emoji">${a.emoji}</div>
          <div class="card-meta">
            <span class="cat-tag">${a.cat}</span>
            <span class="read-time">⏱ ${a.min} min</span>
          </div>
        </div>
        <h2>${a.title}</h2>
        <p>${a.desc}</p>
        <div class="card-footer">
          <span class="read-link">Read article <span class="arrow">→</span></span>
          <span class="card-num">#${String(i + 1).padStart(2, '0')}</span>
        </div>`;
      gridEl.appendChild(card);
    });
    resultsBar.textContent = `Showing ${list.length} of ${ARTICLES.length} article${ARTICLES.length !== 1 ? 's' : ''}`;
  }

  renderCards(ARTICLES);

  // ── Filter + Search ────────────────────────────────────────────────────────
  let activeCat = 'all';
  let searchVal = '';

  function applyFilter() {
    const filtered = ARTICLES.filter(a => {
      const matchCat    = activeCat === 'all' || a.cat.toLowerCase() === activeCat;
      const matchSearch = (a.title + ' ' + a.cat + ' ' + a.desc).toLowerCase().includes(searchVal);
      return matchCat && matchSearch;
    });
    renderCards(filtered);
  }

  filterBar.addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    applyFilter();
  });

  searchEl.addEventListener('input', () => {
    searchVal = searchEl.value.toLowerCase().trim();
    applyFilter();
  });
}

// Kick off
scanBlogFolder();

// ── THEME ─────────────────────────────────────────────────────────────────────
function toggleTheme() {
  const isNowLight = document.documentElement.classList.toggle('light');
  localStorage.setItem('mfn-theme', isNowLight ? 'light' : 'dark');
}
(function initTheme() {
  const saved = localStorage.getItem('mfn-theme');
  const preferLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  if (saved === 'light' || (!saved && preferLight)) document.documentElement.classList.add('light');
})();

// ── MOBILE MENU ───────────────────────────────────────────────────────────────
function openMenu()  { document.getElementById('sm').classList.add('on');    document.getElementById('ov').classList.add('on');    }
function closeMenu() { document.getElementById('sm').classList.remove('on'); document.getElementById('ov').classList.remove('on'); }

// ── go() ──────────────────────────────────────────────────────────────────────
(function () {
  var FILE_MAP = {
    'home':'home.html','si':'calculators/simple-interest.html','ci':'calculators/compound-interest.html',
    'emi':'calculators/emi.html','prepay':'calculators/loan-prepayment.html','bp':'calculators/blueprint.html',
    'retire':'calculators/retirement.html','fire':'calculators/fire.html','infl':'calculators/inflation.html',
    'crore':'calculators/first-crore.html','swp':'calculators/swp.html','nps':'calculators/nps.html'
  };
  window.go = function (page) { var f = FILE_MAP[page]; if (f) window.location.href = f; };
})();

// ── COMPONENT LOADER ──────────────────────────────────────────────────────────
(function () {
  var components = [
    { url: 'components/navbar.html', id: 'navbar-container' },
    { url: 'components/footer.html', id: 'footer-container' }
  ];
  var loaded = 0;
  function tryReinit() {
    if (++loaded === components.length) {
      try {
        document.querySelectorAll('.mi').forEach(function (el) {
          if (el.textContent.trim().indexOf('Blog') !== -1) el.classList.add('act');
        });
      } catch (e) {}
    }
  }
  components.forEach(function (c) {
    fetch(c.url)
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (html) { var el = document.getElementById(c.id); if (el) el.innerHTML = html; tryReinit(); })
      .catch(function () { tryReinit(); });
  });
})();
</script>
</body>
